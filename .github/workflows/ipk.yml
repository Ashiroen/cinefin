name: IPK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package:webos

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Decode Android keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build Android TV APK
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew :androidtv:assembleRelease :androidtv:assembleDebug
            mkdir -p dist/apk
            cp apps/androidtv/build/outputs/apk/release/*.apk dist/apk/ 2>/dev/null || true
            cp apps/androidtv/build/outputs/apk/debug/*.apk dist/apk/
          else
            ./gradlew :androidtv:assembleDebug
            mkdir -p dist/apk
            cp apps/androidtv/build/outputs/apk/debug/*.apk dist/apk/
          fi

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinefin-ipk
          path: dist/ipk/*.ipk
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinefin-androidtv-apk
          path: dist/apk/*.apk
          if-no-files-found: error

      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest
          commit: ${{ github.sha }}
          artifacts: dist/ipk/*.ipk,dist/apk/*.apk
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
          body: |
            Rolling sideload build from `main` (`${{ github.sha }}`).

            - webOS: download the `.ipk`, then install with `ares-install` or webOS Dev Manager. See [docs/INSTALL-webos.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL-webos.md).
            - Android TV / Shield: download the `.apk`, then `adb install` or [Downloader](https://play.google.com/store/apps/details?id=com.esaba.downloader). See [docs/androidtv.md](https://github.com/${{ github.repository }}/blob/main/docs/androidtv.md).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/ipk/*.ipk,dist/apk/*.apk
          artifactErrorsFailBuild: true
          allowUpdates: true
          generateReleaseNotes: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
