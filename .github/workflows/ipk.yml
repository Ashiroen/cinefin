name: IPK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package:webos

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinefin-ipk
          path: dist/ipk/*.ipk
          if-no-files-found: error

      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest
          commit: ${{ github.sha }}
          artifacts: dist/ipk/*.ipk
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
          body: |
            Rolling sideload build from `main` (`${{ github.sha }}`).

            Download the `.ipk` below, then install it with `ares-install` or webOS Dev Manager. See [docs/INSTALL-webos.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL-webos.md).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/ipk/*.ipk
          artifactErrorsFailBuild: true
          allowUpdates: true
          generateReleaseNotes: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
