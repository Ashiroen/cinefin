name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package:webos
      - uses: actions/upload-artifact@v4
        with:
          name: cinefin-ipk
          path: dist/ipk/*.ipk
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :androidtv:testDebugUnitTest :androidtv:lintDebug :androidtv:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: cinefin-androidtv-apk
          path: apps/androidtv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
